name: Setup Python App
description: Setup Python with pip cache and install order-service dependencies

inputs:
  python-version:
    description: Python version to use
    required: true
  install-deps:
    description: Extra dependency groups (e.g. dev)
    required: false
    default: dev
  working-directory:
    description: Path to the Python application
    required: false
    default: order-service

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[${{ inputs.install-deps }}]"
