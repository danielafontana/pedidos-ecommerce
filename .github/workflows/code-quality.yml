name: Code Quality

on:
  pull_request:
    branches: ["main", "master", "develop"]
  push:
    branches: ["main", "master", "develop"]
  workflow_dispatch:
  workflow_call:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python-app
        with:
          python-version: ${{ matrix.python-version }}
          install-deps: dev

      - name: Ruff (Linting)
        run: |
          ruff check --config=../.code_quality/ruff.toml src/ tests/

      - name: Ruff (Format Check)
        run: |
          ruff format --check --config=../.code_quality/ruff.toml src/ tests/

      - name: Flake8
        run: |
          flake8 --config=../.code_quality/.flake8 src/ tests/

      - name: MyPy (Type Checking)
        run: |
          mypy --config-file=../.code_quality/mypy.ini src/ tests/

      - name: Code Quality Summary
        if: always()
        run: |
          echo "### Code Quality Checks Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Python:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruff lint:** executed" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruff format:** executed" >> $GITHUB_STEP_SUMMARY
          echo "- **Flake8:** executed" >> $GITHUB_STEP_SUMMARY
          echo "- **MyPy:** executed" >> $GITHUB_STEP_SUMMARY
