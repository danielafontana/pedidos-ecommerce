name: Tests

on:
  pull_request:
    branches: ["main", "master", "develop"]
  push:
    branches: ["main", "master", "develop"]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: order-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-python-app
        with:
          python-version: ${{ matrix.python-version }}
          install-deps: dev

      - name: Run unit tests with pytest and coverage
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=order_service.domain \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not integration and not contract"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: order-service/coverage.xml
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "### Unit Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Python:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope:** \`tests/unit/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage target:** \`order_service.domain\`" >> $GITHUB_STEP_SUMMARY
